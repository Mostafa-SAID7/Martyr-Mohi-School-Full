name: CodeQL Security Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run CodeQL weekly on Monday at 3:00 AM UTC
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # v2 is long out of support (supported majors are v4 and v3); running an
      # unsupported action risks a hard failure whenever GitHub retires it.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # `analyze` finalizes the database, runs the queries AND uploads the
      # resulting SARIF to the Security tab. A separate upload-sarif step is
      # therefore both redundant and wrong: it points at results.sarif, which
      # nothing in this job ever writes (analyze keeps its SARIF internal), so
      # it can only fail with "Path does not exist". Uploading twice under the
      # same category would also be rejected as a misconfiguration.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
